<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fantasy — weekly view</title>
<style>
  :root{
    --bg:#14150f;
    --card:#1c1d16;
    --card-2:#22231a;
    --line:#33352a;
    --ink:#eae7dc;
    --ink-dim:#a7a495;
    --ink-faint:#6f6d61;
    --gold:#e8b34d;
    --up:#7fae8a;
    --down:#c0705a;
    --rival:#8f8fd9;
    --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    padding:14px 14px 40px;
  }
  a{color:inherit;}

  .topline{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .topline .who{
    font-size:13px;
    color:var(--ink-dim);
    display:flex;
    align-items:baseline;
    gap:6px;
  }
  .topline .who button{
    background:none;border:none;color:var(--ink-faint);
    font-size:12px;text-decoration:underline;cursor:pointer;padding:0;
    font-family:var(--sans);
  }
  .topline .week{
    font-size:13px;color:var(--ink-faint);
    font-family:var(--mono);
  }

  .userbox{
    display:none;
    gap:8px;
    margin-bottom:14px;
  }
  .userbox.show{display:flex;}
  .userbox input{
    flex:1;
    background:var(--card);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:6px;
    padding:8px 10px;
    font-size:14px;
    font-family:var(--sans);
  }
  .userbox button{
    background:var(--gold);
    border:none;
    color:#241a06;
    font-weight:600;
    border-radius:6px;
    padding:8px 12px;
    font-size:13px;
    cursor:pointer;
  }

  .tabs{
    display:flex;
    gap:8px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .tab{
    background:var(--card);
    border:1px solid var(--line);
    color:var(--ink-dim);
    padding:7px 12px 8px;
    border-radius:10px;
    font-size:13px;
    cursor:pointer;
    white-space:nowrap;
    text-align:left;
    display:flex;
    flex-direction:column;
    gap:3px;
    font-family:var(--sans);
    min-width:0;
  }
  .tab .tname{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    max-width:120px;
  }
  .tab .tscore{
    font-family:var(--mono);
    font-size:12px;
    color:var(--ink-faint);
  }
  .tab .tscore .win{color:var(--up);}
  .tab .tscore .loss{color:var(--down);}
  .tab.active{
    border-color:var(--gold);
  }
  .tab.active .tname{color:var(--gold);font-weight:600;}

  .status{
    color:var(--ink-faint);
    font-size:13px;
    padding:30px 0;
    text-align:center;
  }
  .status.error{color:var(--down);}

  .scorecard{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px;
    margin-bottom:16px;
  }
  .scorerow{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
  }
  .side{width:44%;}
  .side.opp{text-align:right;}
  .teamname{
    font-size:13px;
    color:var(--ink-dim);
    margin-bottom:2px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .teamuser{
    font-size:11px;
    color:var(--ink-faint);
    margin-bottom:6px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .score{
    font-family:var(--mono);
    font-size:32px;
    letter-spacing:-0.5px;
  }
  .score.win{color:var(--up);}
  .score.loss{color:var(--down);}
  .statusline{
    font-size:10px;
    color:var(--ink-faint);
    margin-top:6px;
    font-family:var(--mono);
  }
  .statusline .live{color:var(--gold);}
  .projtotal{
    font-size:11px;
    color:var(--ink-faint);
    margin-top:4px;
    font-family:var(--mono);
  }
  .vs{
    font-size:11px;
    color:var(--ink-faint);
    padding-bottom:8px;
    font-family:var(--mono);
  }

  .section-label{
    font-size:12px;
    color:var(--ink-faint);
    margin:18px 0 8px;
    padding-left:2px;
  }

  .plist{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
  }
  .prow{
    padding:9px 12px;
    border-bottom:1px solid var(--line);
  }
  .prow:last-child{border-bottom:none;}
  .prow[data-pid]{cursor:pointer;}
  .prow-top{
    display:flex;
    align-items:flex-start;
    gap:10px;
  }
  .prow-left{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
  }
  .prow-mainline{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .prow .pos{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-faint);
    width:30px;
    flex-shrink:0;
  }
  .prow .pname{
    flex:1;
    font-size:12.5px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    min-width:0;
  }
  .pstatus{
    font-family:var(--mono);
    font-size:10px;
    font-weight:600;
    padding:1px 4px;
    border-radius:4px;
    flex-shrink:0;
  }
  .pstatus-mid{background:rgba(232,179,77,0.18);color:var(--gold);}
  .pstatus-out{background:rgba(192,112,90,0.18);color:var(--down);}
  .prow .pteam{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-faint);
    flex-shrink:0;
  }
  .ppts-col{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    flex-shrink:0;
    min-width:44px;
  }
  .prow .ppts{
    font-family:var(--mono);
    font-size:14px;
    text-align:right;
  }
  .prow .pproj{
    font-family:var(--mono);
    font-size:10px;
    color:var(--ink-faint);
    text-align:right;
    margin-top:1px;
  }
  .prow .pproj.proj-over{color:var(--up);}
  .prow .pproj.proj-under{color:var(--down);}
  .prow-sub{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:2px;
  }
  @media (max-width:480px){
    .prow-top{gap:6px;}
    .prow-mainline{gap:6px;}
    .prow-sub{gap:4px;}
    .ppts-col{min-width:36px;}
  }
  .prow-subtext{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-faint);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    min-width:0;
  }
  .dual{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .dcol{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    min-width:0;
  }
  .dcol-head{
    font-size:11px;
    color:var(--ink-faint);
    padding:8px 10px 6px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    border-bottom:1px solid var(--line);
  }
  /* subtle highlight for a player whose game is currently in progress --
     inset box-shadow instead of a real border so row height/width don't shift */
  .row-live{
    background:rgba(232,179,77,0.06);
    box-shadow:inset 3px 0 0 var(--gold);
  }
  .flags{
    display:flex;
    gap:4px;
    flex-shrink:0;
  }
  .flag{
    padding:1px 5px;
    border-radius:4px;
    font-size:9px;
    font-family:var(--mono);
    font-weight:600;
    letter-spacing:0.2px;
    white-space:nowrap;
    flex-shrink:0;
  }
  /* deliberately NOT reusing --up/--down/--gold here: those already mean
     "this player's own status" (healthy-ish/out/questionable) via .pstatus.
     These flags are a different axis (cross-league exposure), so they get
     their own color + words instead of single letters, to stop the old
     red "O" (opponent) from reading as the red "O" (Out) status badge. */
  .flag-mine{background:rgba(127,174,138,0.18); color:var(--up);}
  .flag-opp{background:rgba(143,143,217,0.2); color:var(--rival);}
  .flag-bench{background:rgba(167,164,149,0.18); color:var(--ink-faint);}

  .bench-toggle{
    background:none;
    border:none;
    color:var(--ink-faint);
    font-size:13px;
    cursor:pointer;
    padding:10px 2px;
    font-family:var(--sans);
    display:flex;
    align-items:center;
    gap:5px;
  }
  .bench-wrap{display:none;}
  .bench-wrap.show{display:block;}

  .suggest{
    background:var(--card);
    border:1px solid var(--gold);
    border-radius:12px;
    overflow:hidden;
    margin-bottom:16px;
  }
  .suggest.neutral{border-color:var(--line);}
  .suggest.neutral .suggest-title{color:var(--ink-dim);}
  .suggest-sub{
    font-size:11px;
    color:var(--ink-faint);
    margin-top:3px;
    font-weight:400;
  }
  .suggest-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:12px 14px 10px;
    border-bottom:1px solid var(--line);
  }
  .suggest-title{
    font-size:13px;
    font-weight:600;
    color:var(--gold);
  }
  .suggest-gain{
    font-family:var(--mono);
    font-size:12px;
    color:var(--up);
  }
  .swap{
    padding:10px 14px;
    border-bottom:1px solid var(--line);
  }
  .swap:last-child{border-bottom:none;}
  .swap-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:6px;
  }
  .swap-slot{
    font-family:var(--mono);
    font-size:10px;
    color:var(--ink-faint);
    text-transform:uppercase;
    letter-spacing:0.5px;
  }
  .swap-dismiss{
    background:none;
    border:none;
    color:var(--ink-faint);
    font-size:10px;
    font-family:var(--sans);
    cursor:pointer;
    padding:0;
  }
  .swap-dismiss:hover{color:var(--down);}
  .swap-row{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .swap-row + .swap-row{margin-top:4px;}
  .swap-player{
    flex:1;
    display:flex;
    align-items:center;
    gap:8px;
    min-width:0;
  }
  .swap-name{
    font-size:14px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .swap-out .swap-name{color:var(--ink-faint); text-decoration:line-through;}
  .swap-in .swap-name{color:var(--ink); font-weight:600;}
  .swap-pts{
    font-family:var(--mono);
    font-size:13px;
    flex-shrink:0;
    width:44px;
    text-align:right;
  }
  .swap-out .swap-pts{color:var(--ink-faint);}
  .swap-in .swap-pts{color:var(--up);}
  .swap-arrow{
    color:var(--ink-faint);
    font-size:13px;
    flex-shrink:0;
  }
  .badge{
    font-family:var(--mono);
    font-size:9px;
    font-weight:600;
    padding:1px 5px;
    border-radius:4px;
    flex-shrink:0;
  }
  .badge-vegas{background:rgba(127,174,138,0.18);color:var(--up);}
  .badge-low{background:rgba(232,179,77,0.18);color:var(--gold);}
  .suggest-empty{
    padding:16px 14px;
    text-align:center;
    color:var(--ink-dim);
    font-size:13px;
  }
  .suggest-empty .check{color:var(--up); margin-right:4px;}
  .lock-note{
    font-size:11px;
    color:var(--ink-faint);
    padding:6px 2px 0;
  }

  .drift-alert{
    background:var(--card);
    border:1px solid var(--down);
    border-radius:12px;
    overflow:hidden;
    margin-bottom:10px;
  }
  .drift-head{
    font-size:11px;
    color:var(--down);
    padding:10px 14px 6px;
    text-transform:uppercase;
    letter-spacing:0.3px;
  }
  .drift-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px 14px;
    flex-wrap:wrap;
  }
  .drift-row:last-child{padding-bottom:10px;}
  .drift-name{
    font-size:13px;
    flex:1;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .drift-change{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-dim);
    flex-shrink:0;
  }
  .drift-refresh{
    background:none;
    border:1px solid var(--line);
    color:var(--ink-dim);
    padding:3px 8px;
    border-radius:10px;
    font-size:11px;
    cursor:pointer;
    font-family:var(--sans);
    flex-shrink:0;
  }
  .drift-refresh:disabled{opacity:0.5; cursor:default;}

  .pdetail{
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid var(--line);
    cursor:default;
  }
  .pdetail-loading{
    font-size:11px;
    color:var(--ink-faint);
    padding:4px 0;
  }
  .pdetail-chart{
    display:flex;
    align-items:flex-end;
    gap:6px;
    height:44px;
    margin-bottom:4px;
  }
  .pdetail-barcol{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    height:100%;
    min-width:0;
  }
  .pdetail-bar{
    width:100%;
    max-width:22px;
    background:var(--gold);
    opacity:0.65;
    border-radius:2px 2px 0 0;
  }
  .pdetail-barlabel{
    font-size:9px;
    color:var(--ink-faint);
    font-family:var(--mono);
    margin-top:3px;
  }
  .pdetail-touches{
    font-size:9px;
    color:var(--ink-dim);
    font-family:var(--mono);
  }
  .pdetail-stats{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    font-size:10.5px;
    color:var(--ink-dim);
    font-family:var(--mono);
    margin-bottom:4px;
  }
  .pdetail-trend{
    font-size:10.5px;
    font-family:var(--mono);
    margin-bottom:4px;
  }
  .pdetail-trend.up{color:var(--up);}
  .pdetail-trend.down{color:var(--down);}
  .pdetail-compare{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    font-size:11px;
    color:var(--ink-dim);
    font-family:var(--mono);
    margin-bottom:4px;
  }
  .pdetail-compare b{color:var(--ink); font-weight:600;}
  .pdetail-compare .badge{margin-left:3px;}
  .pdetail-muted{color:var(--ink-faint);}
  .pdetail-usage{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-dim);
    margin-bottom:8px;
  }
  .pdetail-statline{
    background:var(--card-2);
    border-radius:8px;
    padding:8px 10px;
    margin-bottom:8px;
  }
  .pdetail-statline-head{
    font-size:10px;
    color:var(--ink-faint);
    text-transform:uppercase;
    letter-spacing:0.3px;
    margin-bottom:4px;
  }
  .pdetail-stat-row{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:var(--mono);
    font-size:11px;
    padding:2px 0;
  }
  .pdetail-stat-label{flex:1; color:var(--ink-dim); min-width:0;}
  .pdetail-stat-value{color:var(--ink-faint);}
  .pdetail-stat-pts{color:var(--up); width:44px; text-align:right; flex-shrink:0;}
  .pdetail-stat-pts.neg{color:var(--down);}
  .pdetail-proj{
    font-size:11px;
    color:var(--ink-dim);
    font-family:var(--mono);
    margin-bottom:8px;
  }
  .pdetail-proj b{color:var(--ink); font-weight:600;}
  .pdetail-proj .badge{margin-left:4px;}
  .pdetail-proj.out b{color:var(--down);}
  .pdetail-proj.out .badge{background:rgba(192,112,90,0.18); color:var(--down);}
  .pdetail-proj.over b{color:var(--up);}
  .pdetail-proj.under b{color:var(--down);}

  .refresh{
    text-align:center;
    margin-top:20px;
  }
  .refresh button{
    background:none;
    border:1px solid var(--line);
    color:var(--ink-dim);
    padding:7px 14px;
    border-radius:16px;
    font-size:12px;
    cursor:pointer;
    font-family:var(--sans);
  }
</style>
</head>
<body>

<div class="topline">
  <div class="who">@<span id="unameLabel">acrogers</span> <button id="changeUser">change</button> <button id="changeOddsKey">vegas key</button></div>
  <div class="week" id="weekLabel">—</div>
</div>

<div class="userbox" id="userbox">
  <input type="text" id="unameInput" placeholder="sleeper username" value="acrogers">
  <button id="loadUser">Load</button>
</div>

<div class="userbox" id="oddsKeyBox">
  <input type="text" id="oddsKeyInput" placeholder="the-odds-api.com API key (optional)">
  <button id="saveOddsKey">Save</button>
</div>

<div class="tabs" id="tabs"></div>

<div id="content">
  <div class="status" id="status">Loading your leagues…</div>
</div>

<div class="refresh"><button id="refreshBtn">Refresh scores</button></div>

<script>
const API = 'https://api.sleeper.app/v1';
let username = 'acrogers';
let userId = null;
let season = null;
let week = null;
let leagues = [];
let leagueBundles = [];
let activeLeagueIndex = 0;
let benchOpen = true;
let expandedPids = new Set(); // pids with their detail card currently open
let playersMap = null;
let playersLoading = null;
let scheduleByTeam = {};
let weekDateRange = null; // {from, to} ISO strings bounding THIS week's kickoffs, from ESPN's week-scoped scoreboard
let statsMap = null;
let projectionsMap = null;

const el = id => document.getElementById(id);

function fmtPts(n){
  if(n === undefined || n === null) return '—';
  return (Math.round(n*100)/100).toFixed(1);
}

async function getJSON(url){
  const res = await fetch(url);
  if(!res.ok) throw new Error('Request failed: ' + url);
  return res.json();
}

function ensurePlayers(){
  if(playersMap) return Promise.resolve(playersMap);
  if(playersLoading) return playersLoading;
  playersLoading = getJSON(`${API}/players/nfl`).then(data => {
    playersMap = data;
    return data;
  }).catch(err => {
    playersLoading = null;
    throw err;
  });
  return playersLoading;
}

async function fetchStatsOrProjections(kind, season, week){
  const posQuery = '&position[]=QB&position[]=RB&position[]=WR&position[]=TE&position[]=K&position[]=DEF&position[]=FLEX';
  const candidates = [
    `${API}/${kind}/nfl/regular/${season}/${week}`,
    `${API}/${kind}/nfl/${season}/${week}?season_type=regular${posQuery}`,
    `${API}/${kind}/nfl/${season}/${week}?season_type=regular`
  ];
  for(const url of candidates){
    try{
      const data = await getJSON(url);
      if(data && typeof data === 'object' && Object.keys(data).length > 0) return data;
    }catch(e){
      // try the next candidate shape
    }
  }
  return null;
}

async function loadGameContext(){
  const espnUrl = `https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?week=${week}&year=${season}&seasontype=2`;
  const [espnData, statsData, projData] = await Promise.all([
    getJSON(espnUrl).catch(() => null),
    fetchStatsOrProjections('stats', season, week),
    fetchStatsOrProjections('projections', season, week)
  ]);
  if(espnData) scheduleByTeam = buildScheduleMap(espnData);
  if(espnData) weekDateRange = buildWeekDateRange(espnData);
  if(statsData) statsMap = statsData;
  if(projData) projectionsMap = projData;
}

// Bounds THIS week's kickoffs (with a small buffer) so the odds-api events
// call can be scoped to just this week instead of the whole season -- the
// odds-api events endpoint with no date filter returns EVERY game all
// season (verified: 270 events, not ~16), which would make team-based
// matching alone pull odds for future weeks too.
function buildWeekDateRange(espnData){
  const dates = (espnData.events || [])
    .map(ev => ev.date ? new Date(ev.date).getTime() : null)
    .filter(t => t !== null);
  if(dates.length === 0) return null;
  const dayMs = 24 * 60 * 60 * 1000;
  return {
    from: new Date(Math.min(...dates) - dayMs).toISOString(),
    to: new Date(Math.max(...dates) + dayMs).toISOString(),
  };
}

const TEAM_ABBR_ALIASES = {
  'WSH': 'WAS'
};

function normTeamAbbr(abbr){
  return TEAM_ABBR_ALIASES[abbr] || abbr;
}

function buildScheduleMap(espnData){
  const map = {};
  (espnData.events || []).forEach(ev => {
    const comp = ev.competitions && ev.competitions[0];
    if(!comp) return;
    const statusType = comp.status && comp.status.type;
    const state = statusType ? statusType.state : null;
    const detail = statusType ? statusType.shortDetail : '';
    let weekday = '';
    let timeStr = '';
    let kickoffMs = null;
    if(ev.date){
      const dt = new Date(ev.date);
      if(!isNaN(dt.getTime())){
        weekday = dt.toLocaleDateString('en-US', {weekday: 'short'});
        timeStr = dt.toLocaleTimeString('en-US', {hour: 'numeric', minute: '2-digit'});
        kickoffMs = dt.getTime();
      }
    }
    (comp.competitors || []).forEach(c => {
      const abbr = c.team && c.team.abbreviation;
      if(abbr) map[normTeamAbbr(abbr)] = {state, detail, weekday, time: timeStr, kickoffMs};
    });
  });
  return map;
}

function fmtStat(v){
  return (v % 1 === 0) ? v : Math.round(v * 10) / 10;
}

function projectedPoints(pid, scoringSettings){
  if(!projectionsMap || !scoringSettings) return null;
  const s = projectionsMap[pid];
  if(!s) return null;
  let total = 0;
  let any = false;
  for(const key in scoringSettings){
    if(s[key] !== undefined && s[key] !== null){
      total += s[key] * scoringSettings[key];
      any = true;
    }
  }
  return any ? total : null;
}

// --- vegas odds (The Odds API) --------------------------------------------
// Fetched at most ONCE PER WEEK, cached in localStorage keyed by
// season+week. On every load we first check the cache; only a cache miss
// (new week, or nothing cached yet) triggers real network calls, and even
// then only for the games our own rostered players are actually in -- not
// the full slate. Credits are precious on the free tier, so this is
// deliberately conservative: no auto-refresh within a week, no polling.

const ODDS_API_BASE = 'https://api.the-odds-api.com/v4';
const ODDS_MARKETS = 'player_pass_yds,player_pass_tds,player_pass_interceptions,player_rush_yds,player_reception_yds,player_receptions,player_anytime_td';
const VEGAS_CACHE_KEY = 'ffd_vegas_cache_v1';
const VEGAS_RETRY_BACKOFF_MS = 30 * 60 * 1000; // don't hammer the API on repeated failures

const NFL_TEAM_NAME_TO_ABBR = {
  'Arizona Cardinals': 'ARI', 'Atlanta Falcons': 'ATL', 'Baltimore Ravens': 'BAL',
  'Buffalo Bills': 'BUF', 'Carolina Panthers': 'CAR', 'Chicago Bears': 'CHI',
  'Cincinnati Bengals': 'CIN', 'Cleveland Browns': 'CLE', 'Dallas Cowboys': 'DAL',
  'Denver Broncos': 'DEN', 'Detroit Lions': 'DET', 'Green Bay Packers': 'GB',
  'Houston Texans': 'HOU', 'Indianapolis Colts': 'IND', 'Jacksonville Jaguars': 'JAX',
  'Kansas City Chiefs': 'KC', 'Las Vegas Raiders': 'LV', 'Los Angeles Chargers': 'LAC',
  'Los Angeles Rams': 'LAR', 'Miami Dolphins': 'MIA', 'Minnesota Vikings': 'MIN',
  'New England Patriots': 'NE', 'New Orleans Saints': 'NO', 'New York Giants': 'NYG',
  'New York Jets': 'NYJ', 'Philadelphia Eagles': 'PHI', 'Pittsburgh Steelers': 'PIT',
  'San Francisco 49ers': 'SF', 'Seattle Seahawks': 'SEA', 'Tampa Bay Buccaneers': 'TB',
  'Tennessee Titans': 'TEN', 'Washington Commanders': 'WAS',
};

let vegasStatsMap = null; // pid -> {pass_yd,pass_td,pass_int,rush_yd,rec_yd,rec,td_prob,hasFullProps}, in-memory this session
let vegasStatsMapKey = null; // `${season}:${week}` vegasStatsMap was loaded for -- skip re-checking cache/localStorage entirely once set
let vegasPidToEventId = {}; // pid -> odds-api event id, so a drift-triggered refresh can target just that one game
let nameToPidIndex = null;

function oddsApiKey(){
  return (localStorage.getItem('ffd_odds_api_key') || '').trim();
}

function loadVegasCache(){
  try{
    const raw = localStorage.getItem(VEGAS_CACHE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

function saveVegasCache(cache){
  try{ localStorage.setItem(VEGAS_CACHE_KEY, JSON.stringify(cache)); }catch(e){ /* storage full/unavailable */ }
}

function americanToProb(price){
  return price > 0 ? 100 / (price + 100) : -price / (-price + 100);
}

function normalizePlayerName(name){
  return (name || '')
    .toLowerCase()
    .replace(/[.']/g, '')
    .replace(/\s+(jr|sr|ii|iii|iv)\.?$/, '')
    .trim();
}

function buildNameIndex(){
  nameToPidIndex = {};
  if(!playersMap) return;
  Object.keys(playersMap).forEach(pid => {
    const p = playersMap[pid];
    if(!p || !p.full_name || !['QB','RB','WR','TE'].includes(p.position)) return;
    const key = normalizePlayerName(p.full_name);
    // on name collisions, prefer the player currently on an NFL roster
    if(!nameToPidIndex[key] || (!playersMap[nameToPidIndex[key]].team && p.team)){
      nameToPidIndex[key] = pid;
    }
  });
}

function resolvePlayerIdByName(name){
  if(!nameToPidIndex) buildNameIndex();
  return nameToPidIndex[normalizePlayerName(name)] || null;
}

function bestOddsBook(bookmakers){
  const preferred = ['draftkings', 'fanduel', 'betmgm'];
  const byKey = {};
  (bookmakers || []).forEach(b => byKey[b.key] = b);
  for(const k of preferred) if(byKey[k]) return byKey[k];
  return (bookmakers && bookmakers[0]) || null;
}

// Parses one event-odds response into {pid: rawStats}, merging into statsMap.
function mergeEventOddsIntoStatsMap(event, statsMap){
  const book = bestOddsBook(event.bookmakers);
  if(!book) return;
  const byName = {};
  const touch = name => byName[name] || (byName[name] = {pass_yd:0,pass_td:0,pass_int:0,rush_yd:0,rec_yd:0,rec:0,td_prob:0,hasFullProps:false});

  (book.markets || []).forEach(market => {
    (market.outcomes || []).forEach(o => {
      const name = o.description;
      if(!name) return;
      const s = touch(name);
      if(market.key === 'player_pass_yds' && o.name === 'Over'){ s.pass_yd = o.point; s.hasFullProps = true; }
      else if(market.key === 'player_pass_tds' && o.name === 'Over'){ s.pass_td = o.point; }
      else if(market.key === 'player_pass_interceptions' && o.name === 'Over'){ s.pass_int = o.point; }
      else if(market.key === 'player_rush_yds' && o.name === 'Over'){ s.rush_yd = o.point; s.hasFullProps = true; }
      else if(market.key === 'player_reception_yds' && o.name === 'Over'){ s.rec_yd = o.point; s.hasFullProps = true; }
      else if(market.key === 'player_receptions' && o.name === 'Over'){ s.rec = o.point; }
      else if(market.key === 'player_anytime_td' && o.name === 'Yes'){ s.td_prob = americanToProb(o.price); }
    });
  });

  Object.keys(byName).forEach(name => {
    const pid = resolvePlayerIdByName(name);
    if(pid) statsMap[pid] = byName[name];
  });
}

// Determines the NFL team abbreviations for every player on any of my
// rosters across all leagues -- this bounds which games we actually need
// odds for, instead of pulling the full week's slate.
function myRosteredTeams(bundles){
  const teams = new Set();
  bundles.forEach(b => {
    if(!b.summary || !b.summary.myRoster) return;
    (b.summary.myRoster.players || []).forEach(pid => {
      const p = playersMap && playersMap[pid];
      if(p && p.team) teams.add(p.team);
    });
  });
  return teams;
}

// Fetches odds for exactly the given event ids. Network calls only --
// caller is responsible for deciding whether this should run at all.
// Also returns which event each resolved player came from, so a later
// injury-driven refresh can target just that one game.
async function fetchVegasOddsForEvents(eventIds, apiKey){
  const statsMap = {};
  const pidToEventId = {};
  for(const eventId of eventIds){
    const url = `${ODDS_API_BASE}/sports/americanfootball_nfl/events/${eventId}/odds?apiKey=${encodeURIComponent(apiKey)}&regions=us&markets=${ODDS_MARKETS}&oddsFormat=american`;
    const res = await fetch(url);
    if(!res.ok) continue; // skip this game, don't abort the whole batch over one bad response
    const data = await res.json();
    const before = new Set(Object.keys(statsMap));
    mergeEventOddsIntoStatsMap(data, statsMap);
    Object.keys(statsMap).forEach(pid => { if(!before.has(pid)) pidToEventId[pid] = eventId; });
  }
  return {statsMap, pidToEventId};
}

// Top-level entry point: cache-first, at most one fetch pass per week.
async function ensureVegasProjections(bundles){
  const apiKey = oddsApiKey();
  if(!apiKey){ vegasStatsMap = null; vegasStatsMapKey = null; return; }

  const wantKey = `${season}:${week}`;
  if(vegasStatsMap !== null && vegasStatsMapKey === wantKey) return; // already resolved this session, e.g. on a 1s auto-refresh tick

  await ensurePlayers().catch(() => {});
  if(!playersMap){ vegasStatsMap = null; return; }

  const cache = loadVegasCache();
  const cacheIsCurrentWeek = cache && cache.season === season && cache.week === week;
  if(cacheIsCurrentWeek && cache.players){
    vegasStatsMap = cache.players;
    vegasPidToEventId = cache.pidToEventId || {};
    vegasStatsMapKey = wantKey;
    return;
  }
  if(cacheIsCurrentWeek && cache.lastAttempt && (Date.now() - cache.lastAttempt) < VEGAS_RETRY_BACKOFF_MS){
    vegasStatsMap = cache.players || {};
    vegasPidToEventId = cache.pidToEventId || {};
    vegasStatsMapKey = wantKey; // recently failed for this week, back off rather than retry every load
    return;
  }

  const teams = myRosteredTeams(bundles);
  if(teams.size === 0){ vegasStatsMap = {}; vegasStatsMapKey = wantKey; return; }

  // The events endpoint with no date filter returns the ENTIRE SEASON
  // (verified: 270 events, not ~16), so team matching alone would pull
  // future weeks' games too. weekDateRange (from ESPN's week-scoped
  // scoreboard) bounds this to just this week's kickoffs.
  if(!weekDateRange){
    console.warn('vegas odds: no weekDateRange available, skipping to avoid an unbounded events query');
    vegasStatsMap = {};
    vegasStatsMapKey = wantKey;
    return;
  }

  try{
    const eventsUrl = `${ODDS_API_BASE}/sports/americanfootball_nfl/events?apiKey=${encodeURIComponent(apiKey)}`
      + `&commenceTimeFrom=${encodeURIComponent(weekDateRange.from.replace(/\.\d{3}Z$/, 'Z'))}`
      + `&commenceTimeTo=${encodeURIComponent(weekDateRange.to.replace(/\.\d{3}Z$/, 'Z'))}`;
    const eventsRes = await fetch(eventsUrl);
    if(!eventsRes.ok) throw new Error('events fetch failed: ' + eventsRes.status);
    const events = await eventsRes.json();
    let relevantEventIds = events
      .filter(e => teams.has(NFL_TEAM_NAME_TO_ABBR[e.home_team]) || teams.has(NFL_TEAM_NAME_TO_ABBR[e.away_team]))
      .map(e => e.id);

    // hard safety cap -- a normal week is at most ~16 games total, so this
    // should never trigger; if it does, something upstream is wrong (bad
    // date range, bad team match) and we should NOT spend unbounded credits
    const MAX_RELEVANT_EVENTS = 16;
    if(relevantEventIds.length > MAX_RELEVANT_EVENTS){
      console.warn(`vegas odds: ${relevantEventIds.length} relevant events exceeds safety cap of ${MAX_RELEVANT_EVENTS}, truncating`);
      relevantEventIds = relevantEventIds.slice(0, MAX_RELEVANT_EVENTS);
    }

    const {statsMap, pidToEventId} = await fetchVegasOddsForEvents(relevantEventIds, apiKey);
    vegasStatsMap = statsMap;
    vegasPidToEventId = pidToEventId;
    vegasStatsMapKey = wantKey;
    saveVegasCache({season, week, fetchedAt: Date.now(), lastAttempt: Date.now(), players: statsMap, pidToEventId});
  }catch(e){
    console.warn('vegas odds fetch failed:', e);
    vegasStatsMap = (cache && cache.players) || {};
    vegasPidToEventId = (cache && cache.pidToEventId) || {};
    vegasStatsMapKey = wantKey;
    saveVegasCache({season, week, fetchedAt: cache ? cache.fetchedAt : null, lastAttempt: Date.now(), players: vegasStatsMap, pidToEventId: vegasPidToEventId});
  }
}

// Re-fetches odds for just the ONE game a drifted player is in -- scoped
// refresh so an injury-news correction costs ~6-7 credits instead of
// re-pulling the whole week (~70-80 credits). Updates both the in-memory
// state and the persisted weekly cache, and clears the drift flag for
// everyone in that game since their vegas data is now current again.
async function refreshVegasForPlayer(pid){
  const apiKey = oddsApiKey();
  if(!apiKey) return {ok: false, reason: 'no-key'};
  const eventId = vegasPidToEventId[pid];
  if(!eventId) return {ok: false, reason: 'no-event'};

  try{
    const {statsMap, pidToEventId} = await fetchVegasOddsForEvents([eventId], apiKey);
    Object.assign(vegasStatsMap, statsMap);
    Object.assign(vegasPidToEventId, pidToEventId);

    // acknowledge drift for everyone in the refreshed game, not just pid,
    // since their vegas numbers are now current too
    Object.keys(pidToEventId).forEach(refreshedPid => {
      const p = projectionsMap && projectionsMap[refreshedPid];
      if(p && typeof p.pts_ppr === 'number' && sleeperSnapshotForWeek){
        sleeperSnapshotForWeek.players[refreshedPid] = p.pts_ppr;
      }
    });
    saveSleeperSnapshot(sleeperSnapshotForWeek);
    saveVegasCache({season, week, fetchedAt: Date.now(), lastAttempt: Date.now(), players: vegasStatsMap, pidToEventId: vegasPidToEventId});
    return {ok: true};
  }catch(e){
    console.warn('scoped vegas refresh failed:', e);
    return {ok: false, reason: 'fetch-failed'};
  }
}

function vegasProjectionProvider(pid, scoringSettings){
  if(!vegasStatsMap || !scoringSettings) return null;
  const s = vegasStatsMap[pid];
  if(!s) return null;
  // anytime-TD odds don't distinguish rush vs rec TDs, so average the two
  // scoring values as a single multiplier (identical in standard leagues)
  const tdPoints = (((scoringSettings.rush_td !== undefined ? scoringSettings.rush_td : 6)
                    + (scoringSettings.rec_td !== undefined ? scoringSettings.rec_td : 6)) / 2);
  const pts = s.pass_yd * (scoringSettings.pass_yd || 0)
    + s.pass_td * (scoringSettings.pass_td || 0)
    + s.pass_int * (scoringSettings.pass_int || 0)
    + s.rush_yd * (scoringSettings.rush_yd || 0)
    + s.rec_yd * (scoringSettings.rec_yd || 0)
    + s.rec * (scoringSettings.rec || 0)
    + s.td_prob * tdPoints;
  return {proj_pts: Math.round(pts * 10) / 10, source: 'vegas', confidence: s.hasFullProps ? 'normal' : 'low'};
}

// --- mid-week drift detection ----------------------------------------------
// The weekly vegas cache is a snapshot -- if news breaks mid-week (an
// injury to this player, or to a teammate that changes their role), that
// snapshot goes stale until the next full-week refetch. Sleeper's own
// projections update far more often and cost nothing to check, so we use
// THEM as the tripwire: capture a baseline the first time we see this week,
// then compare against it on every later load. A big enough move flags the
// player and offers a scoped single-game vegas refresh (see
// refreshVegasForPlayer above) instead of forcing a full-week refetch.

const SLEEPER_SNAPSHOT_KEY = 'ffd_sleeper_snapshot_v1';
const DRIFT_ABS_THRESHOLD = 3;    // pts
const DRIFT_REL_THRESHOLD = 0.25; // 25%, only applied once baseline is above noise level

let sleeperSnapshotForWeek = null; // {season, week, players: {pid: pts_ppr}, capturedAt}

function loadSleeperSnapshot(){
  try{
    const raw = localStorage.getItem(SLEEPER_SNAPSHOT_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

function saveSleeperSnapshot(snap){
  if(!snap) return;
  try{ localStorage.setItem(SLEEPER_SNAPSHOT_KEY, JSON.stringify(snap)); }catch(e){ /* storage full/unavailable */ }
}

function myRosteredPlayerIds(bundles){
  const ids = new Set();
  bundles.forEach(b => {
    if(!b.summary || !b.summary.myRoster) return;
    (b.summary.myRoster.players || []).forEach(pid => ids.add(pid));
  });
  return [...ids];
}

// Captures this week's baseline exactly once (first load of a new week);
// every later call this week is then just an in-memory no-op read. Doesn't
// touch the network -- projectionsMap is already loaded via loadGameContext.
function ensureSleeperSnapshot(rosterPids){
  const existing = loadSleeperSnapshot();
  if(existing && existing.season === season && existing.week === week){
    sleeperSnapshotForWeek = existing;
    return;
  }
  const players = {};
  rosterPids.forEach(pid => {
    const p = projectionsMap && projectionsMap[pid];
    if(p && typeof p.pts_ppr === 'number') players[pid] = p.pts_ppr;
  });
  sleeperSnapshotForWeek = {season, week, players, capturedAt: Date.now()};
  saveSleeperSnapshot(sleeperSnapshotForWeek);
}

// Returns {baseline, current, delta} if pid's Sleeper projection has moved
// enough since the weekly baseline to be worth flagging, else null.
function detectDrift(pid){
  if(!sleeperSnapshotForWeek) return null;
  const baseline = sleeperSnapshotForWeek.players[pid];
  const proj = projectionsMap && projectionsMap[pid];
  const current = proj && typeof proj.pts_ppr === 'number' ? proj.pts_ppr : null;
  if(baseline === undefined || current === null) return null;

  const delta = current - baseline;
  const meetsAbs = Math.abs(delta) >= DRIFT_ABS_THRESHOLD;
  const meetsRel = baseline > 1 ? Math.abs(delta) >= DRIFT_REL_THRESHOLD * baseline : true;
  if(meetsAbs && meetsRel) return {baseline, current, delta};
  return null;
}

// --- projection providers -----------------------------------------------
// A provider takes (pid, scoringSettings) and returns either
// {proj_pts, source, confidence} or null (no opinion -- try the next one).
// Providers are tried in order; the first non-null result wins. This is the
// seam for dropping in a vegas-odds-based provider later: implement it with
// this same signature and unshift() it onto PROJECTION_PROVIDERS so it's
// tried before the sleeper fallback. Nothing else in the lineup optimizer
// needs to change.

function sleeperProjectionProvider(pid, scoringSettings){
  const pts = projectedPoints(pid, scoringSettings);
  if(pts === null) return null;
  return {proj_pts: pts, source: 'sleeper', confidence: 'normal'};
}

const PROJECTION_PROVIDERS = [vegasProjectionProvider, sleeperProjectionProvider];

// Statuses that mean "not playing" outright -- Questionable/Doubtful are
// left to the normal projection (their odds/Sleeper number already prices
// in the risk), but these mean zero regardless of what any cached number says.
const OUT_STATUSES = new Set(['Out', 'IR', 'Suspended', 'PUP', 'NA']);

// Checked fresh every time, never cached: a player going Out (or Sleeper's
// own projection collapsing to 0 games-played) overrides EVERYTHING,
// including a same-week vegas number fetched before the injury news broke.
// Vegas isn't re-pulled fast enough mid-week to catch this on its own, and
// there's no reason to trust/spend credits on odds for someone who's out.
//
// This ONLY applies pre-game. An Out tag that lands mid-game or after
// (left with an injury, ruled out post-game) doesn't mean they scored
// zero -- they may have real accrued stats. Once their game has started,
// the real numbers speak for themselves instead of this override.
function isPlayerOut(pid){
  const info = playerLabel(pid);
  const sched = info.team ? scheduleByTeam[info.team] : null;
  if(sched && sched.state !== 'pre') return false;
  if(OUT_STATUSES.has(info.status)) return true;
  const proj = projectionsMap && projectionsMap[pid];
  if(proj && proj.gp === 0) return true;
  return false;
}

function getPlayerProjection(pid, scoringSettings){
  if(isPlayerOut(pid)){
    return {proj_pts: 0, source: 'out', confidence: 'normal'};
  }
  for(const provider of PROJECTION_PROVIDERS){
    const result = provider(pid, scoringSettings);
    if(result) return result;
  }
  return {proj_pts: null, source: 'none', confidence: 'low'};
}

// Once a game is FINAL, the real score is strictly better information than
// any pre-game estimate -- use it as the "projection" everywhere (lineup
// optimizer, scorecard total, per-row display) instead of a stale number.
// originalProjPts (the pre-game estimate) is carried along so the UI can
// show whether the player beat or missed it.
function effectiveProjection(pid, scoringSettings, actualPts){
  const info = playerLabel(pid);
  const sched = info.team ? scheduleByTeam[info.team] : null;
  const original = getPlayerProjection(pid, scoringSettings);

  if(sched && sched.state === 'post' && typeof actualPts === 'number'){
    return {proj_pts: actualPts, source: 'final', confidence: 'normal', originalProjPts: original.proj_pts};
  }
  return {...original, originalProjPts: null};
}

// --- lineup optimizer ------------------------------------------------------
// Pure functions: (roster slots, players w/ proj_pts) -> best legal lineup,
// then diffed against what's currently started. See spikes/odds-spike/
// lineup_optimizer.py for the prototype + reasoning this was ported from.

const SLOT_ELIGIBILITY = {
  QB: ['QB'], RB: ['RB'], WR: ['WR'], TE: ['TE'], K: ['K'], DEF: ['DEF'],
  FLEX: ['RB','WR','TE'],
  WRRB_FLEX: ['RB','WR'],
  REC_FLEX: ['WR','TE'],
  SUPER_FLEX: ['QB','RB','WR','TE'],
};

// "Practically equal" projection band for the flex late-kickoff tiebreak
// below -- deliberately small so it only catches genuine near-ties/noise,
// never overrides a real scoring edge (this app has surfaced legitimate
// swap recommendations as small as 0.6-0.7 pts).
const FLEX_TIE_EPSILON = 0.3;

// Minimum difference between a final actual score and the pre-game
// projection before it's worth color-coding -- avoids flagging trivial
// rounding noise as "beat" or "missed" projection.
const PROJ_DIFF_EPSILON = 0.5;

function startableSlots(rosterPositions){
  const skip = new Set(['BN','IR','TAXI']);
  return (rosterPositions || []).filter(s => !skip.has(s));
}

// A player whose game has already kicked off (live or final) can't legally
// be added or dropped anymore -- roster lock happens at kickoff. Reuses the
// same scheduleByTeam data the live/final badges already use.
function isPlayerLocked(pid){
  const info = playerLabel(pid);
  if(!info.team) return false;
  const sched = scheduleByTeam[info.team];
  if(!sched) return false;
  return sched.state === 'in' || sched.state === 'post';
}

// Greedily fills slots from MOST to LEAST restrictive eligibility set
// (dedicated single-position slots first, then FLEX, then SUPER_FLEX last).
// Optimal for this "nested eligibility" slot structure: a narrower slot is
// never starved by a broader slot grabbing a player it could've used from
// elsewhere just as easily.
//
// forcedIds: players locked into their CURRENT starting slot (game already
// underway/over) -- pinned to their existing slot before anything else is
// assigned, and never considered for eviction.
function optimalLineup(rosterPositions, players, forcedIds, currentStarterIds){
  forcedIds = forcedIds || new Set();
  const playersById = {};
  players.forEach(p => playersById[p.id] = p);

  const result = new Array(rosterPositions.length).fill(null);
  const usedIds = new Set();

  (currentStarterIds || []).forEach((pid, idx) => {
    if(pid && forcedIds.has(pid) && playersById[pid]){
      result[idx] = playersById[pid];
      usedIds.add(pid);
    }
  });

  const slotOrder = rosterPositions
    .map((slot, idx) => ({idx, size: (SLOT_ELIGIBILITY[slot] || []).length}))
    .sort((a, b) => a.size - b.size)
    .map(x => x.idx)
    .filter(idx => result[idx] === null);

  const available = players.filter(p => p.proj_pts !== null && p.proj_pts !== undefined && p.proj_pts !== 0);

  for(const idx of slotOrder){
    const eligible = SLOT_ELIGIBILITY[rosterPositions[idx]] || [];
    const candidates = available.filter(p => !usedIds.has(p.id) && eligible.includes(p.position));
    if(candidates.length === 0) continue;

    const maxPts = Math.max(...candidates.map(p => p.proj_pts));
    // Score always wins beyond FLEX_TIE_EPSILON. Only within that narrow
    // "practically equal" band, and only for a FLEX-type slot (eligible
    // for more than one position), does a later kickoff break the tie --
    // it keeps that roster spot swappable longer, so you can react to
    // early-game injury news before it locks. Comparing against the true
    // max (not a rolling "best so far") means this can never walk the
    // pick meaningfully below the top score through a chain of small steps.
    let best;
    const isFlexSlot = eligible.length > 1;
    const tied = isFlexSlot ? candidates.filter(p => maxPts - p.proj_pts <= FLEX_TIE_EPSILON) : null;
    if(tied && tied.length > 1){
      best = tied.reduce((b, p) => ((p.kickoffMs || 0) > (b.kickoffMs || 0) ? p : b));
    }else{
      best = candidates.reduce((b, p) => (p.proj_pts > b.proj_pts ? p : b));
    }

    usedIds.add(best.id);
    result[idx] = best;
  }
  return result;
}

// Compares who's CURRENTLY starting vs the optimizer's pick, using set
// difference (not slot-index matching) so pure slot reshuffles among
// players who are ALL still starting don't get misreported as swaps.
function diffLineup(rosterPositions, currentStarterIds, optimalAssignment, playersById){
  const currentSet = new Set(currentStarterIds.filter(pid => pid && pid !== '0'));
  const optimalSet = new Set(optimalAssignment.filter(Boolean).map(p => p.id));

  const shouldStart = [...optimalSet].filter(id => !currentSet.has(id));
  const shouldBench = [...currentSet].filter(id => !optimalSet.has(id));

  const currentPts = [...currentSet].reduce((sum, id) => sum + ((playersById[id] && playersById[id].proj_pts) || 0), 0);
  const optimalPts = optimalAssignment.reduce((sum, p) => sum + (p ? p.proj_pts : 0), 0);

  if(shouldStart.length === 0 && shouldBench.length === 0){
    return {changes: [], currentPts, optimalPts, gain: 0, message: 'Your lineup is already optimal.'};
  }

  let shouldBenchRemaining = [...shouldBench];
  const changes = [];
  const incomingBySlot = [];
  optimalAssignment.forEach((p, idx) => {
    if(p && shouldStart.includes(p.id)) incomingBySlot.push({idx, p});
  });

  for(const {idx, p: incoming} of incomingBySlot){
    const slot = rosterPositions[idx];
    const originalOccupantId = currentStarterIds[idx];
    const outgoingId = shouldBenchRemaining.includes(originalOccupantId)
      ? originalOccupantId
      : shouldBenchRemaining[0];
    if(outgoingId) shouldBenchRemaining = shouldBenchRemaining.filter(id => id !== outgoingId);
    const outgoing = outgoingId ? playersById[outgoingId] : null;
    const gain = incoming.proj_pts - (outgoing ? outgoing.proj_pts : 0);
    changes.push({
      slot,
      benchId: outgoing ? outgoing.id : null,
      bench: outgoing ? outgoing.name : '(empty)',
      benchPts: outgoing ? outgoing.proj_pts : 0,
      startId: incoming.id,
      start: incoming.name,
      startPts: incoming.proj_pts,
      startSource: incoming.source,
      startConfidence: incoming.confidence,
      gain,
    });
  }

  changes.sort((a, b) => b.gain - a.gain);
  return {
    changes, currentPts, optimalPts,
    gain: optimalPts - currentPts,
    message: `${changes.length} change${changes.length > 1 ? 's' : ''} recommended, +${fmtPts(optimalPts - currentPts)} pts`,
  };
}

// --- dismissed suggestions --------------------------------------------
// "Ignore this suggestion" persists per (week, league, the two players
// involved, AND their point values) -- so if you dismiss a swap and the
// projections later shift enough to change the numbers, it's treated as a
// genuinely different suggestion and reappears rather than staying hidden
// forever on stale reasoning. Naturally resets every week since `week` is
// part of the key.
const DISMISSED_SUGGESTIONS_KEY = 'ffd_dismissed_suggestions_v1';

function loadDismissedSuggestions(){
  try{
    const raw = localStorage.getItem(DISMISSED_SUGGESTIONS_KEY);
    return raw ? new Set(JSON.parse(raw)) : new Set();
  }catch(e){ return new Set(); }
}

function saveDismissedSuggestions(set){
  try{ localStorage.setItem(DISMISSED_SUGGESTIONS_KEY, JSON.stringify([...set])); }catch(e){ /* storage full/unavailable */ }
}

function suggestionKey(leagueId, change){
  return [
    season, week, leagueId,
    change.benchId || 'empty', change.startId,
    change.benchPts.toFixed(1), change.startPts.toFixed(1),
  ].join(':');
}

function buildSuggestion(league, myRoster, myEntry){
  if(!myRoster || !myEntry || !myEntry.starters) return null;
  const rosterPositions = startableSlots(league.roster_positions);
  const scoringSettings = league.scoring_settings;
  const reserve = new Set([...(myRoster.reserve || []), ...(myRoster.taxi || [])]);
  const currentStarterSet = new Set(myEntry.starters.filter(pid => pid && pid !== '0'));

  const players = (myRoster.players || [])
    .filter(pid => !reserve.has(pid))
    .map(pid => {
      const info = playerLabel(pid);
      const actualPts = myEntry.players_points ? myEntry.players_points[pid] : undefined;
      const proj = effectiveProjection(pid, scoringSettings, actualPts);
      const sched = info.team ? scheduleByTeam[info.team] : null;
      return {
        id: pid, name: info.name, position: info.position,
        proj_pts: proj.proj_pts, source: proj.source, confidence: proj.confidence,
        locked: isPlayerLocked(pid), isCurrentStarter: currentStarterSet.has(pid),
        kickoffMs: sched ? sched.kickoffMs : null,
      };
    });
  const playersById = {};
  players.forEach(p => playersById[p.id] = p);

  // locked starters can't be benched (game underway/over); locked bench
  // players can't be added (missed the roster lock) -- drop them from the
  // pool entirely so the optimizer can never suggest them.
  const eligiblePool = players.filter(p => !p.locked || p.isCurrentStarter);
  const forcedStarterIds = new Set(players.filter(p => p.locked && p.isCurrentStarter).map(p => p.id));
  const lockedOutBenchCount = players.filter(p => p.locked && !p.isCurrentStarter).length;

  const assignment = optimalLineup(rosterPositions, eligiblePool, forcedStarterIds, myEntry.starters);
  const result = diffLineup(rosterPositions, myEntry.starters, assignment, playersById);
  result.lockedStarterCount = forcedStarterIds.size;
  result.lockedOutBenchCount = lockedOutBenchCount;

  // drop any changes the user has explicitly ignored, then recompute the
  // displayed total/message from what's actually still showing -- the
  // header shouldn't claim a gain from a swap we're no longer rendering
  const dismissed = loadDismissedSuggestions();
  const keyedChanges = result.changes.map(c => ({...c, key: suggestionKey(league.league_id, c)}));
  const visibleChanges = keyedChanges.filter(c => !dismissed.has(c.key));
  const dismissedCount = keyedChanges.length - visibleChanges.length;

  // A change on a FLEX-type slot with a near-zero gain isn't a real scoring
  // edge -- it's the late-kickoff tiebreak above trading a hair of expected
  // value for roster flexibility. That's a fundamentally different kind of
  // recommendation (nice-to-have, not "you should do this for points"), so
  // it's split into its own bucket instead of polluting the score-driven
  // "+X pts" card with a swap that isn't really about points.
  const isFlexSlotChange = c => (SLOT_ELIGIBILITY[c.slot] || []).length > 1;
  const scoreChanges = visibleChanges.filter(c => !(isFlexSlotChange(c) && Math.abs(c.gain) <= FLEX_TIE_EPSILON));
  const flexChanges = visibleChanges.filter(c => isFlexSlotChange(c) && Math.abs(c.gain) <= FLEX_TIE_EPSILON);
  const scoreGain = scoreChanges.reduce((sum, c) => sum + c.gain, 0);

  result.changes = scoreChanges;
  result.flexChanges = flexChanges;
  result.dismissedCount = dismissedCount;
  result.gain = scoreGain;
  result.message = scoreChanges.length === 0
    ? (dismissedCount > 0
        ? `${dismissedCount} suggestion${dismissedCount > 1 ? 's' : ''} dismissed`
        : 'Your lineup is already optimal.')
    : `${scoreChanges.length} change${scoreChanges.length > 1 ? 's' : ''} recommended, +${fmtPts(scoreGain)} pts`;

  // Mid-week drift: Sleeper's projection moving a lot since our weekly
  // baseline usually means real news (injury to this player or a
  // teammate). "Out"/gp=0 is already forced to 0 pts elsewhere and so
  // already fixes itself in the optimizer above -- this catches the softer
  // case (Questionable, role change) where a stale cached vegas number
  // might not reflect it yet.
  result.driftAlerts = players
    .map(p => {
      const drift = detectDrift(p.id);
      if(!drift) return null;
      return {pid: p.id, name: p.name, baseline: drift.baseline, current: drift.current, delta: drift.delta, eventId: vegasPidToEventId[p.id] || null};
    })
    .filter(Boolean);

  return result;
}

function lockNoteHTML(result){
  const locked = (result.lockedStarterCount || 0) + (result.lockedOutBenchCount || 0);
  if(!locked) return '';
  return `<div class="lock-note">${locked} player${locked > 1 ? 's' : ''} already locked (game started/final) &mdash; excluded from suggestions</div>`;
}

function driftHTML(driftAlerts){
  if(!driftAlerts || driftAlerts.length === 0) return '';
  const rows = driftAlerts.map(d => `
    <div class="drift-row">
      <span class="drift-name">${escapeHtml(d.name)}</span>
      <span class="drift-change">${fmtPts(d.baseline)} &rarr; ${fmtPts(d.current)} pts</span>
      ${d.eventId ? `<button class="drift-refresh" data-pid="${escapeHtml(d.pid)}">refresh vegas</button>` : ''}
    </div>`).join('');
  return `<div class="drift-alert">
    <div class="drift-head">projection moved since last check &mdash; possible injury news</div>
    ${rows}
  </div>`;
}

// Near-tied FLEX swaps where a later kickoff broke the tie -- not a real
// scoring edge, so this gets its own card instead of sitting in the
// "+X pts" one where a ~0 point "gain" would look like a broken suggestion.
function flexTimingHTML(flexChanges){
  if(!flexChanges || flexChanges.length === 0) return '';
  const rows = flexChanges.map(c => `
    <div class="swap">
      <div class="swap-head">
        <div class="swap-slot">${escapeHtml(c.slot)}</div>
        <button class="swap-dismiss" data-key="${escapeHtml(c.key)}" title="Ignore this suggestion">&times; ignore</button>
      </div>
      <div class="swap-row">
        <div class="swap-player swap-out"><span class="swap-name">${escapeHtml(c.bench)}</span></div>
        <div class="swap-pts">${fmtPts(c.benchPts)}</div>
      </div>
      <div class="swap-row">
        <span class="swap-arrow">&#8627;</span>
        <div class="swap-player swap-in"><span class="swap-name">${escapeHtml(c.start)}</span></div>
        <div class="swap-pts">${fmtPts(c.startPts)}</div>
      </div>
    </div>`).join('');
  return `<div class="suggest neutral">
    <div class="suggest-head">
      <div>
        <div class="suggest-title">Flex timing (${flexChanges.length})</div>
        <div class="suggest-sub">near-identical projection &mdash; later kickoff keeps this slot swappable longer</div>
      </div>
    </div>
    ${rows}
  </div>`;
}

function suggestionHTML(result){
  if(!result) return '';
  const drift = driftHTML(result.driftAlerts);
  const flexTiming = flexTimingHTML(result.flexChanges);
  if(result.changes.length === 0){
    return `${drift}<div class="suggest neutral"><div class="suggest-empty"><span class="check">&#10003;</span> ${escapeHtml(result.message)}</div></div>${lockNoteHTML(result)}${flexTiming}`;
  }
  const rows = result.changes.map(c => `
    <div class="swap">
      <div class="swap-head">
        <div class="swap-slot">${escapeHtml(c.slot)}</div>
        <button class="swap-dismiss" data-key="${escapeHtml(c.key)}" title="Ignore this suggestion">&times; ignore</button>
      </div>
      <div class="swap-row">
        <div class="swap-player swap-out"><span class="swap-name">${escapeHtml(c.bench)}</span></div>
        <div class="swap-pts">${fmtPts(c.benchPts)}</div>
      </div>
      <div class="swap-row">
        <span class="swap-arrow">&#8627;</span>
        <div class="swap-player swap-in">
          <span class="swap-name">${escapeHtml(c.start)}</span>
          ${c.startSource === 'vegas' ? '<span class="badge badge-vegas">VEGAS</span>' : ''}
          ${c.startConfidence === 'low' ? '<span class="badge badge-low">LOW CONF</span>' : ''}
        </div>
        <div class="swap-pts">${fmtPts(c.startPts)}</div>
      </div>
    </div>`).join('');
  return `${drift}<div class="suggest">
    <div class="suggest-head">
      <div class="suggest-title">${result.changes.length} change${result.changes.length > 1 ? 's' : ''} recommended</div>
      <div class="suggest-gain">+${fmtPts(result.gain)} pts</div>
    </div>
    ${rows}
  </div>${lockNoteHTML(result)}${flexTiming}`;
}

function teamProjectedTotal(entry, scoringSettings){
  if(!entry || !entry.starters || !scoringSettings) return null;
  let total = 0;
  let any = false;
  entry.starters.forEach(pid => {
    const actualPts = entry.players_points ? entry.players_points[pid] : undefined;
    const p = effectiveProjection(pid, scoringSettings, actualPts).proj_pts;
    if(p !== null){
      total += p;
      any = true;
    }
  });
  return any ? total : null;
}

// Compact shorthand byline -- paired stats (completions/attempts,
// catches/targets) collapse to a bare "X/Y" ratio, everything else gets a
// short unit with a single space, joined with no separator padding so a
// lot more fits in a tight row.
function statByline(pid){
  const s = statsMap && statsMap[pid];
  if(!s) return '';

  const parts = [];
  if(s.pass_att) parts.push(`${fmtStat(s.pass_cmp || 0)}/${fmtStat(s.pass_att)}`);
  if(s.pass_yd) parts.push(`${fmtStat(s.pass_yd)} yd`);
  if(s.pass_td) parts.push(`${fmtStat(s.pass_td)} TD`);
  if(s.pass_int) parts.push(`${fmtStat(s.pass_int)} INT`);
  if(s.rush_att) parts.push(`${fmtStat(s.rush_att)} car`);
  if(s.rush_yd) parts.push(`${fmtStat(s.rush_yd)} yd`);
  if(s.rush_td) parts.push(`${fmtStat(s.rush_td)} TD`);
  if(s.rec_tgt) parts.push(`${fmtStat(s.rec || 0)}/${fmtStat(s.rec_tgt)}`);
  else if(s.rec) parts.push(`${fmtStat(s.rec)} rec`);
  if(s.rec_yd) parts.push(`${fmtStat(s.rec_yd)} yd`);
  if(s.rec_td) parts.push(`${fmtStat(s.rec_td)} TD`);
  if(s.fgm) parts.push(`${fmtStat(s.fgm)} FG`);
  if(s.xpm) parts.push(`${fmtStat(s.xpm)} XP`);
  if(s.sack) parts.push(`${fmtStat(s.sack)} sk`);
  if(s.def_int) parts.push(`${fmtStat(s.def_int)} INT`);
  if(s.ff) parts.push(`${fmtStat(s.ff)} FF`);
  if(s.fr) parts.push(`${fmtStat(s.fr)} FR`);
  if(s.def_td) parts.push(`${fmtStat(s.def_td)} TD`);

  return parts.slice(0, 3).join(' ');
}

function fmtKickoff(weekday, timeStr){
  if(!weekday) return '';
  if(!timeStr) return weekday;
  let compact = timeStr.replace(/\s+/g, '').toLowerCase(); // "1:00pm"
  compact = compact.replace(':00', ''); // "1pm" when on the hour
  compact = compact.replace('pm', 'p').replace('am', 'a'); // "1p"
  return `${weekday} ${compact}`;
}

function gameSubline(pid, info){
  if(!pid || pid === '0' || !info.team) return '';
  const sched = scheduleByTeam[info.team];
  if(!sched) return '';
  if(sched.state === 'pre') return fmtKickoff(sched.weekday, sched.time) || 'Scheduled';
  const byline = statByline(pid);
  if(sched.state === 'post') return byline ? `${byline}·Final` : 'Final';
  return byline ? `${byline}·${sched.detail}` : (sched.detail || 'Live');
}

function timingBrief(info){
  if(!info.team) return {text:'', cls:''};
  const sched = scheduleByTeam[info.team];
  if(!sched) return {text:'', cls:''};
  if(sched.state === 'pre') return {text: fmtKickoff(sched.weekday, sched.time) || 'Scheduled', cls:''};
  if(sched.state === 'post') return {text:'Final', cls:'final'};
  return {text:'Live', cls:'live'};
}

function lastNameOf(name){
  const parts = (name || '').trim().split(' ');
  return parts[parts.length - 1] || name;
}

// --- player detail card (click-to-expand) -----------------------------
// Recent-games history for the little chart + touches trend. Each Sleeper
// stats-by-week call returns EVERY player for that week in one response, so
// we fetch each week ONCE and reuse it for every player card that gets
// expanded -- not one fetch per player. Free/unlimited endpoint, no credit
// concern, so this is fetched lazily (only once the user actually expands
// a card) and kept in memory for the rest of the session.
let historicalStatsByWeek = {}; // week -> {pid: statLine}
let historicalStatsLoading = null;
const HISTORY_WEEKS = 5;

function ensureHistoricalStats(){
  const weeksNeeded = [];
  for(let w = Math.max(1, week - HISTORY_WEEKS); w < week; w++){
    if(!historicalStatsByWeek[w]) weeksNeeded.push(w);
  }
  if(weeksNeeded.length === 0) return Promise.resolve();
  if(historicalStatsLoading) return historicalStatsLoading;
  historicalStatsLoading = Promise.all(weeksNeeded.map(w =>
    getJSON(`${API}/stats/nfl/regular/${season}/${w}`)
      .then(data => { historicalStatsByWeek[w] = data; })
      .catch(() => { historicalStatsByWeek[w] = {}; }) // mark attempted, don't retry forever this session
  )).then(() => { historicalStatsLoading = null; });
  return historicalStatsLoading;
}

const TOUCHES_POSITIONS = new Set(['QB', 'RB', 'WR', 'TE']);

// The sleeper/vegas comparison block -- shown regardless of whether chart
// history exists (e.g. week 1, before any games have been played).
// Readable labels for the scoring-relevant stat keys Sleeper uses. Falls
// back to a humanized version of the raw key for anything not covered here
// (custom/rare league scoring categories), so nothing is silently dropped.
const STAT_LABELS = {
  pass_yd: 'pass yd', pass_td: 'pass TD', pass_int: 'INT', pass_2pt: 'pass 2pt', pass_cmp: 'completions',
  rush_yd: 'rush yd', rush_td: 'rush TD', rush_2pt: 'rush 2pt',
  rec: 'reception', rec_yd: 'rec yd', rec_td: 'rec TD', rec_2pt: 'rec 2pt',
  fum_lost: 'fumble lost', fum_rec_td: 'fumble TD',
  fgm: 'FG made', fgm_0_19: 'FG 0-19', fgm_20_29: 'FG 20-29', fgm_30_39: 'FG 30-39',
  fgm_40_49: 'FG 40-49', fgm_50p: 'FG 50+', fgmiss: 'FG missed', fgmiss_0_19: 'FG miss 0-19',
  xpm: 'XP made', xpmiss: 'XP missed',
  def_td: 'def TD', def_int: 'def INT', sack: 'sack', ff: 'forced fumble', fr: 'fumble rec',
  safe: 'safety', blk_kick: 'blocked kick', def_st_td: 'ST TD', st_td: 'ST TD',
  pts_allow_0: 'pts allowed 0', pts_allow_1_6: 'pts allowed 1-6', pts_allow_7_13: 'pts allowed 7-13',
  pts_allow_14_20: 'pts allowed 14-20', pts_allow_21_27: 'pts allowed 21-27',
  pts_allow_28_34: 'pts allowed 28-34', pts_allow_35p: 'pts allowed 35+',
  bonus_rec_yd_100: '100+ rec yd bonus', bonus_rush_yd_100: '100+ rush yd bonus',
  bonus_pass_yd_300: '300+ pass yd bonus', bonus_pass_yd_400: '400+ pass yd bonus',
};

function humanizeStatKey(key){
  return STAT_LABELS[key] || key.replace(/_/g, ' ');
}

// Every stat that actually moved the needle on this player's score this
// week, driven off the LEAGUE's own scoring_settings (not a hardcoded
// assumption) so it's correct for any custom scoring setup. Only shows
// stats with a nonzero weight AND a nonzero value -- e.g. a QB's rec_yd
// weight exists in scoring_settings but never applies to them.
// Volume/opportunity stats that don't directly score in most leagues
// (carries, targets, snaps) but matter for gauging role/usage trend going
// forward -- shown separately from the scoring breakdown since they're a
// different kind of signal (workload, not points).
function usageHTML(pid){
  const s = statsMap && statsMap[pid];
  if(!s) return '';
  const parts = [];
  if(s.rush_att) parts.push(`${fmtStat(s.rush_att)} carries`);
  if(s.rec_tgt) parts.push(`${fmtStat(s.rec_tgt)} targets`);
  const snaps = s.off_snp !== undefined ? s.off_snp : s.snp;
  if(snaps) parts.push(`${fmtStat(snaps)} snaps`);
  if(parts.length === 0) return '';
  return `<div class="pdetail-usage">${parts.join(' &middot; ')}</div>`;
}

function statBreakdownHTML(pid, scoringSettings){
  const s = statsMap && statsMap[pid];
  if(!s || !scoringSettings) return '';
  const rows = [];
  for(const key in scoringSettings){
    const weight = scoringSettings[key];
    const value = s[key];
    if(!weight || !value) continue;
    const contribution = value * weight;
    if(Math.abs(contribution) < 0.05) continue;
    rows.push({key, value, contribution});
  }
  if(rows.length === 0) return '';
  rows.sort((a, b) => Math.abs(b.contribution) - Math.abs(a.contribution));
  const items = rows.map(r => `
    <div class="pdetail-stat-row">
      <span class="pdetail-stat-label">${escapeHtml(humanizeStatKey(r.key))}</span>
      <span class="pdetail-stat-value">${fmtStat(r.value)}</span>
      <span class="pdetail-stat-pts ${r.contribution < 0 ? 'neg' : ''}">${r.contribution > 0 ? '+' : ''}${fmtPts(r.contribution)}</span>
    </div>`).join('');
  return `<div class="pdetail-statline">
    <div class="pdetail-statline-head">this week's stats</div>
    ${items}
  </div>`;
}

function projectionCompareHTML(pid, scoringSettings, actualPts){
  const out = isPlayerOut(pid);
  const sleeperProj = sleeperProjectionProvider(pid, scoringSettings);
  const vegasProj = vegasProjectionProvider(pid, scoringSettings);
  const effective = effectiveProjection(pid, scoringSettings, actualPts);
  const isFinal = effective.source === 'final';

  const rows = [];
  if(vegasProj !== null){
    rows.push(`<span>vegas <b>${fmtPts(vegasProj.proj_pts)}</b>${vegasProj.confidence === 'low' ? ' <span class="badge badge-low">LOW CONF</span>' : ''}</span>`);
  }else if(oddsApiKey()){
    rows.push(`<span class="pdetail-muted">vegas &mdash; no props posted</span>`);
  }
  rows.push(`<span>sleeper ${sleeperProj !== null ? `<b>${fmtPts(sleeperProj.proj_pts)}</b>` : '&mdash;'}</span>`);

  let finalNote;
  if(isFinal){
    const diff = effective.proj_pts - effective.originalProjPts;
    const cls = diff > PROJ_DIFF_EPSILON ? 'over' : diff < -PROJ_DIFF_EPSILON ? 'under' : '';
    finalNote = `<div class="pdetail-proj ${cls}">final: <b>${fmtPts(effective.proj_pts)}</b> pts <span class="badge">FINAL</span> <span class="pdetail-muted">(pre-game proj ${fmtPts(effective.originalProjPts)})</span></div>`;
  }else if(out){
    finalNote = `<div class="pdetail-proj out">using: <b>0</b> pts <span class="badge">OUT</span></div>`;
  }else{
    finalNote = `<div class="pdetail-proj">using: <b>${fmtPts(effective.proj_pts)}</b> pts <span class="badge ${vegasProj !== null ? 'badge-vegas' : ''}">${vegasProj !== null ? 'VEGAS' : sleeperProj !== null ? 'SLEEPER' : 'NO DATA'}</span></div>`;
  }

  return `<div class="pdetail-compare">${rows.join('')}</div>${finalNote}`;
}

function playerDetailHTML(pid, scoringSettings, actualPts){
  const compareHTML = projectionCompareHTML(pid, scoringSettings, actualPts);
  const usageHtml = usageHTML(pid);
  const statHTML = statBreakdownHTML(pid, scoringSettings);

  const rangeWeeks = [];
  for(let w = Math.max(1, week - HISTORY_WEEKS); w < week; w++) rangeWeeks.push(w);

  if(rangeWeeks.length === 0){
    return `<div class="pdetail">${compareHTML}${usageHtml}${statHTML}<div class="pdetail-loading">No games played yet this season.</div></div>`;
  }

  const weeksAvailable = rangeWeeks.filter(w => historicalStatsByWeek[w]);
  if(weeksAvailable.length === 0){
    return `<div class="pdetail">${compareHTML}${usageHtml}${statHTML}<div class="pdetail-loading">Loading recent games…</div></div>`;
  }

  const info = playerLabel(pid);
  const showTouches = TOUCHES_POSITIONS.has(info.position);

  const games = weeksAvailable.map(w => {
    const s = historicalStatsByWeek[w][pid];
    return {
      week: w,
      pts: s && typeof s.pts_ppr === 'number' ? s.pts_ppr : null, // null = bye/inactive/no data that week
      touches: s ? (s.rush_att || 0) + (s.rec_tgt || 0) : 0,
    };
  });

  const played = games.filter(g => g.pts !== null);
  const maxPts = Math.max(1, ...played.map(g => g.pts));
  const seasonAvg = played.length ? played.reduce((a, g) => a + g.pts, 0) / played.length : null;
  const recentGames = played.slice(-3);
  const recentAvg = recentGames.length ? recentGames.reduce((a, g) => a + g.pts, 0) / recentGames.length : null;
  const touchesRecentAvg = recentGames.length ? recentGames.reduce((a, g) => a + g.touches, 0) / recentGames.length : null;

  const bars = games.map(g => {
    const h = g.pts === null ? 2 : Math.max(2, Math.round((g.pts / maxPts) * 44));
    const title = g.pts === null ? 'Bye / no data' : `${fmtPts(g.pts)} pts, ${g.touches} touches`;
    return `<div class="pdetail-barcol" title="${escapeHtml(title)}">
      <div class="pdetail-bar" style="height:${h}px"></div>
      <div class="pdetail-barlabel">W${g.week}</div>
      ${showTouches ? `<div class="pdetail-touches">${g.pts === null ? '&mdash;' : g.touches}</div>` : ''}
    </div>`;
  }).join('');

  let trendNote = '';
  if(showTouches && recentAvg !== null && seasonAvg !== null && Math.abs(recentAvg - seasonAvg) >= 3){
    const up = recentAvg > seasonAvg;
    trendNote = `<div class="pdetail-trend ${up ? 'up' : 'down'}">${up ? '&#9650;' : '&#9660;'} recent avg ${fmtPts(recentAvg)} vs season avg ${fmtPts(seasonAvg)}</div>`;
  }

  return `<div class="pdetail">
    ${compareHTML}
    ${usageHtml}
    ${statHTML}
    <div class="pdetail-chart">${bars || ''}</div>
    <div class="pdetail-stats">
      <span>season avg ${fmtPts(seasonAvg)}</span>
      <span>last 3 avg ${fmtPts(recentAvg)}</span>
      ${showTouches ? `<span>touches (3wk) ${touchesRecentAvg === null ? '&mdash;' : touchesRecentAvg.toFixed(1)}/gm</span>` : ''}
    </div>
    ${trendNote}
  </div>`;
}

function playerLabel(pid){
  if(pid === '0' || !pid) return {name:'Empty', team:'', position:'', status:''};
  const p = playersMap && playersMap[pid];
  if(!p) return {name: pid, team:'', position:'', status:''};
  if(p.position === 'DEF') return {name: p.full_name || pid, team: p.team || '', position:'DEF', status:''};
  const name = p.full_name || `${p.first_name||''} ${p.last_name||''}`.trim() || pid;
  return {name, team: p.team || '', position: p.position || '', status: p.injury_status || ''};
}

const STATUS_ABBR = {
  'Questionable':'Q', 'Doubtful':'D', 'Out':'O', 'IR':'IR',
  'PUP':'PUP', 'Suspended':'SUS', 'COVID-19':'COV', 'NA':'NA'
};

function statusCounts(entry){
  const counts = {played:0, live:0, upcoming:0};
  if(!entry || !entry.starters) return counts;
  entry.starters.forEach(pid => {
    if(pid === '0' || !pid) return;
    const info = playerLabel(pid);
    if(!info.team) return;
    const sched = scheduleByTeam[info.team];
    if(!sched) return;
    if(sched.state === 'pre') counts.upcoming++;
    else if(sched.state === 'post') counts.played++;
    else counts.live++;
  });
  return counts;
}

function statuslineHTML(entry){
  const c = statusCounts(entry);
  return `${c.played} final · <span class="live">${c.live} live</span> · ${c.upcoming} upcoming`;
}

function statusBadge(status){
  if(!status) return '';
  const abbr = STATUS_ABBR[status] || status;
  const severe = status === 'Out' || status === 'IR' || status === 'Suspended' || status === 'Doubtful';
  const cls = severe ? 'pstatus-out' : 'pstatus-mid';
  return `<span class="pstatus ${cls}" title="${escapeHtml(status)}">${escapeHtml(abbr)}</span>`;
}

async function init(){
  try{
    const state = await getJSON(`${API}/state/nfl`);
    season = state.season;
    week = state.display_week || state.week || 1;
    el('weekLabel').textContent = `week ${week}`;
  }catch(e){
    el('weekLabel').textContent = '';
  }
  await loadUserAndLeagues();
}

async function loadUserAndLeagues(){
  el('unameLabel').textContent = username;
  el('tabs').innerHTML = '';
  el('content').innerHTML = '<div class="status" id="status">Loading your leagues…</div>';
  try{
    const user = await getJSON(`${API}/user/${encodeURIComponent(username)}`);
    if(!user || !user.user_id) throw new Error('User not found');
    userId = user.user_id;
    leagues = await getJSON(`${API}/user/${userId}/leagues/nfl/${season}`);
    if(!leagues || leagues.length === 0){
      el('content').innerHTML = '<div class="status">No leagues found for this season.</div>';
      return;
    }
    ensurePlayers().catch(()=>{});
    activeLeagueIndex = 0;
    await loadAllBundles();
    renderTabs();
    showLeague(0);
  }catch(e){
    el('content').innerHTML = `<div class="status error">Couldn't load — check the username and try again.</div>`;
  }
}

async function loadAllBundles(opts){
  const silent = opts && opts.silent;
  if(!silent){
    el('tabs').innerHTML = '';
    el('content').innerHTML = '<div class="status">Loading your matchups…</div>';
  }
  const [results] = await Promise.all([
    Promise.all(leagues.map(async lg => {
      try{
        const [rosters, users, matchups] = await Promise.all([
          getJSON(`${API}/league/${lg.league_id}/rosters`),
          getJSON(`${API}/league/${lg.league_id}/users`),
          getJSON(`${API}/league/${lg.league_id}/matchups/${week}`)
        ]);
        const summary = computeSummary(lg, rosters, users, matchups);
        return {league: lg, rosters, users, matchups, summary, error: null};
      }catch(e){
        return {league: lg, error: e};
      }
    })),
    loadGameContext().catch(() => {})
  ]);
  leagueBundles = results;
  ensureSleeperSnapshot(myRosteredPlayerIds(results));
  await ensureVegasProjections(results).catch(() => {});
  if(!silent) await ensurePlayers().catch(()=>{});
}

function renderTabs(){
  const tabs = el('tabs');
  tabs.innerHTML = '';
  leagueBundles.forEach((b, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (i === activeLeagueIndex ? ' active' : '');
    let scoreLine = '<span class="tscore">—</span>';
    if(b.summary){
      const s = b.summary;
      scoreLine = `<span class="tscore"><span class="${s.myClass}">${fmtPts(s.myPts)}</span> – <span class="${s.oppClass}">${fmtPts(s.oppPts)}</span></span>`;
    }
    btn.innerHTML = `<span class="tname">${escapeHtml(leagueDisplayName(b.league.name))}</span>${scoreLine}`;
    btn.onclick = () => {
      activeLeagueIndex = i;
      renderTabs();
      showLeague(i);
    };
    tabs.appendChild(btn);
  });
}

function showLeague(index){
  const bundle = leagueBundles[index];
  if(!bundle || bundle.error){
    el('content').innerHTML = '<div class="status error">Couldn\'t load this league right now.</div>';
    return;
  }
  renderLeague(bundle.league, bundle.rosters, bundle.users, bundle.matchups, bundle.summary);
}

function teamNameFor(userObj){
  if(!userObj) return 'Unknown';
  return (userObj.metadata && userObj.metadata.team_name) || userObj.display_name || 'Unknown';
}

const LEAGUE_ALIASES = {
  'Yes Fun League': 'Purdue',
  "The Ramily's Family friends": 'Colorado'
};

function leagueDisplayName(name){
  return LEAGUE_ALIASES[name] || name;
}

function crossLeagueFlags(pid, currentIndex){
  const flags = {mineStart:false, mineBench:false, oppStart:false};
  if(pid === '0' || !pid) return flags;
  leagueBundles.forEach((b, i) => {
    if(i === currentIndex || !b.summary) return;
    const s = b.summary;
    if(s.myEntry && s.myEntry.starters && s.myEntry.starters.includes(pid)){
      flags.mineStart = true;
    }else if(s.myRoster && (s.myRoster.players||[]).includes(pid)){
      flags.mineBench = true;
    }
    if(s.oppEntry && s.oppEntry.starters && s.oppEntry.starters.includes(pid)){
      flags.oppStart = true;
    }
  });
  return flags;
}

function computeSummary(league, rosters, users, matchups){
  const usersById = {};
  users.forEach(u => usersById[u.user_id] = u);

  const myRoster = rosters.find(r => r.owner_id === userId);
  if(!myRoster) return null;

  const myEntry = matchups.find(m => m.roster_id === myRoster.roster_id);
  let oppEntry = null, oppRoster = null;
  if(myEntry && myEntry.matchup_id != null){
    oppEntry = matchups.find(m => m.matchup_id === myEntry.matchup_id && m.roster_id !== myRoster.roster_id);
    if(oppEntry) oppRoster = rosters.find(r => r.roster_id === oppEntry.roster_id);
  }

  const myPts = myEntry ? myEntry.points : 0;
  const oppPts = oppEntry ? oppEntry.points : 0;
  const myUser = usersById[myRoster.owner_id];
  const oppUser = oppRoster ? usersById[oppRoster.owner_id] : null;
  const myName = teamNameFor(myUser);
  const oppName = oppRoster ? teamNameFor(oppUser) : 'No matchup this week';
  const myUsername = myUser ? myUser.username : '';
  const oppUsername = oppUser ? oppUser.username : '';

  let myClass = '', oppClass = '';
  if(oppEntry){
    myClass = myPts > oppPts ? 'win' : (myPts < oppPts ? 'loss' : '');
    oppClass = oppPts > myPts ? 'win' : (oppPts < myPts ? 'loss' : '');
  }

  return {myRoster, myEntry, oppEntry, oppRoster, myPts, oppPts, myName, oppName, myUsername, oppUsername, myClass, oppClass};
}

function renderLeague(league, rosters, users, matchups, summary){
  const {myRoster, myEntry, oppEntry, oppRoster, myName, oppName, myUsername, oppUsername, myPts, oppPts, myClass, oppClass} = summary;

  let myCompact = '';
  let oppCompact = '';
  let benchRows = '';
  let oppBenchRows = '';
  let myBenchCount = 0;
  let oppBenchCount = 0;

  if(myEntry && myEntry.starters){
    myEntry.starters.forEach((pid, i) => {
      const info = playerLabel(pid);
      const pts = myEntry.starters_points ? myEntry.starters_points[i] : undefined;
      const flags = crossLeagueFlags(pid, activeLeagueIndex);
      myCompact += prowHTML('', info, pts, flags, pid, league.scoring_settings);
    });
    const benchIds = (myRoster.players || []).filter(pid => !myEntry.starters.includes(pid));
    myBenchCount = benchIds.length;
    benchIds.forEach(pid => {
      const info = playerLabel(pid);
      const pts = myEntry.players_points ? myEntry.players_points[pid] : undefined;
      const flags = crossLeagueFlags(pid, activeLeagueIndex);
      benchRows += prowHTML('', info, pts, flags, pid, league.scoring_settings);
    });
  }
  if(oppEntry && oppEntry.starters){
    oppEntry.starters.forEach((pid, i) => {
      const info = playerLabel(pid);
      const pts = oppEntry.starters_points ? oppEntry.starters_points[i] : undefined;
      const flags = crossLeagueFlags(pid, activeLeagueIndex);
      oppCompact += prowHTML('', info, pts, flags, pid, league.scoring_settings);
    });
    const oppBenchIds = (oppRoster && oppRoster.players || []).filter(pid => !oppEntry.starters.includes(pid));
    oppBenchCount = oppBenchIds.length;
    oppBenchIds.forEach(pid => {
      const info = playerLabel(pid);
      const pts = oppEntry.players_points ? oppEntry.players_points[pid] : undefined;
      const flags = crossLeagueFlags(pid, activeLeagueIndex);
      oppBenchRows += prowHTML('', info, pts, flags, pid, league.scoring_settings);
    });
  }

  const suggestion = buildSuggestion(league, myRoster, myEntry);

  el('content').innerHTML = `
    <div class="scorecard">
      <div class="scorerow">
        <div class="side">
          <div class="teamname">${escapeHtml(myName)}</div>
          <div class="teamuser">${myUsername ? '@' + escapeHtml(myUsername) : ''}</div>
          <div class="score ${myClass}">${fmtPts(myPts)}</div>
          <div class="projtotal">proj ${fmtPts(teamProjectedTotal(myEntry, league.scoring_settings))}</div>
          <div class="statusline">${statuslineHTML(myEntry)}</div>
        </div>
        <div class="vs">vs</div>
        <div class="side opp">
          <div class="teamname">${escapeHtml(oppName)}</div>
          <div class="teamuser">${oppUsername ? '@' + escapeHtml(oppUsername) : ''}</div>
          <div class="score ${oppClass}">${fmtPts(oppPts)}</div>
          <div class="projtotal">proj ${fmtPts(teamProjectedTotal(oppEntry, league.scoring_settings))}</div>
          <div class="statusline">${statuslineHTML(oppEntry)}</div>
        </div>
      </div>
    </div>

    <div class="section-label">suggested lineup</div>
    ${suggestionHTML(suggestion)}

    <div class="section-label">starters</div>
    <div class="dual">
      <div class="dcol">
        <div class="dcol-head">${escapeHtml(myName)}</div>
        ${myCompact || '<div class="prow"><div class="pname">No lineup set</div></div>'}
      </div>
      <div class="dcol">
        <div class="dcol-head">${escapeHtml(oppName)}</div>
        ${oppCompact || '<div class="prow"><div class="pname">&mdash;</div></div>'}
      </div>
    </div>

    <button class="bench-toggle" id="benchToggle">${benchOpen ? '▾' : '▸'} bench</button>
    <div class="bench-wrap${benchOpen ? ' show' : ''}" id="benchWrap">
      <div class="dual">
        <div class="dcol">
          <div class="dcol-head">${escapeHtml(myName)} bench (${myBenchCount})</div>
          ${benchRows || '<div class="prow"><div class="pname">Empty</div></div>'}
        </div>
        <div class="dcol">
          <div class="dcol-head">${escapeHtml(oppName)} bench (${oppBenchCount})</div>
          ${oppBenchRows || '<div class="prow"><div class="pname">Empty</div></div>'}
        </div>
      </div>
    </div>
  `;

  const toggle = el('benchToggle');
  const wrap = el('benchWrap');
  toggle.onclick = () => {
    benchOpen = !benchOpen;
    wrap.classList.toggle('show', benchOpen);
    toggle.textContent = toggle.textContent.replace(benchOpen ? '▸' : '▾', benchOpen ? '▾' : '▸');
  };

  document.querySelectorAll('.drift-refresh').forEach(btn => {
    btn.onclick = async () => {
      btn.disabled = true;
      btn.textContent = 'refreshing…';
      const result = await refreshVegasForPlayer(btn.dataset.pid);
      if(!result.ok) btn.textContent = 'failed, try again';
      renderTabs();
      showLeague(activeLeagueIndex);
    };
  });
