  document.querySelectorAll('.swap-dismiss').forEach(btn => {
    btn.onclick = () => {
      const dismissed = loadDismissedSuggestions();
      dismissed.add(btn.dataset.key);
      saveDismissedSuggestions(dismissed);
      renderTabs();
      showLeague(activeLeagueIndex);
    };
  });

  document.querySelectorAll('.prow[data-pid]').forEach(rowEl => {
    rowEl.onclick = async () => {
      const pid = rowEl.dataset.pid;
      if(expandedPids.has(pid)){
        expandedPids.delete(pid);
      }else{
        expandedPids.add(pid);
        await ensureHistoricalStats().catch(() => {});
      }
      renderTabs();
      showLeague(activeLeagueIndex);
    };
  });
}

function prowHTML(label, info, pts, flags, pid, scoringSettings){
  flags = flags || {};
  let badges = '';
  if(flags.mineStart) badges += `<span class="flag flag-mine" title="Also starting on your other team">DBL</span>`;
  if(flags.oppStart) badges += `<span class="flag flag-opp" title="Starting against you in your other league">OPP</span>`;
  if(flags.mineBench) badges += `<span class="flag flag-bench" title="On your bench in your other league">BEN</span>`;
  const sub = gameSubline(pid, info);
  const timing = timingBrief(info);
  const clickable = pid && pid !== '0';
  const expanded = clickable && expandedPids.has(pid);
  const projResult = scoringSettings ? effectiveProjection(pid, scoringSettings, pts) : null;
  const proj = projResult ? projResult.proj_pts : null;
  // Once final, "proj" is really the actual score -- color it vs. what was
  // projected pre-game so a glance shows who beat/missed expectations.
  let projClass = '';
  if(projResult && projResult.originalProjPts !== null && proj !== null){
    const diff = proj - projResult.originalProjPts;
    if(diff > PROJ_DIFF_EPSILON) projClass = ' proj-over';
    else if(diff < -PROJ_DIFF_EPSILON) projClass = ' proj-under';
  }
  return `<div class="prow${timing.cls === 'live' ? ' row-live' : ''}"${clickable ? ` data-pid="${escapeHtml(pid)}"` : ''}>
    <div class="prow-top">
      <div class="prow-left">
        <div class="prow-mainline">
          ${label ? `<div class="pos">${escapeHtml(label)}</div>` : ''}
          <div class="pname">${escapeHtml(info.name)}</div>
          ${statusBadge(info.status)}
        </div>
        <div class="prow-sub">
          ${info.position !== 'DEF' ? `<span class="pteam">${escapeHtml(info.team)}</span>` : ''}
          ${sub ? `<span class="prow-subtext">${escapeHtml(sub)}</span>` : ''}
          ${badges ? `<span class="flags">${badges}</span>` : ''}
        </div>
      </div>
      <div class="ppts-col">
        <div class="ppts">${fmtPts(pts)}</div>
        ${proj !== null ? `<div class="pproj${projClass}" title="${projResult.originalProjPts !== null ? `pre-game proj: ${fmtPts(projResult.originalProjPts)}` : ''}">${fmtPts(proj)}</div>` : ''}
      </div>
    </div>
    ${expanded ? playerDetailHTML(pid, scoringSettings, pts) : ''}
  </div>`;
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}

el('changeUser').onclick = () => {
  el('userbox').classList.toggle('show');
};
el('loadUser').onclick = () => {
  const v = el('unameInput').value.trim();
  if(v){
    username = v;
    el('userbox').classList.remove('show');
    loadUserAndLeagues();
  }
};
el('changeOddsKey').onclick = () => {
  el('oddsKeyInput').value = oddsApiKey();
  el('oddsKeyBox').classList.toggle('show');
};
el('saveOddsKey').onclick = async () => {
  const v = el('oddsKeyInput').value.trim();
  if(v) localStorage.setItem('ffd_odds_api_key', v);
  else localStorage.removeItem('ffd_odds_api_key');
  // key changed -- drop any cached state so the next load re-evaluates
  // with the new key instead of reusing a stale miss/backoff
  localStorage.removeItem(VEGAS_CACHE_KEY);
  vegasStatsMap = null;
  vegasStatsMapKey = null;
  el('oddsKeyBox').classList.remove('show');
  if(leagues.length){
    await loadAllBundles();
    renderTabs();
    showLeague(activeLeagueIndex);
  }
};
el('refreshBtn').onclick = async () => {
  if(!leagues.length) return;
  await loadAllBundles();
  renderTabs();
  showLeague(activeLeagueIndex);
};

let isTicking = false;
let autoRefreshTimer = null;

async function tick(){
  if(isTicking || !leagues.length) return;
  isTicking = true;
  try{
    await loadAllBundles({silent:true});
    renderTabs();
    showLeague(activeLeagueIndex);
  }catch(e){
    // keep last known data on a failed tick
  }finally{
    isTicking = false;
  }
}

function startAutoRefresh(){
  if(autoRefreshTimer) return;
  autoRefreshTimer = setInterval(tick, 1000);
}

function stopAutoRefresh(){
  if(autoRefreshTimer){
    clearInterval(autoRefreshTimer);
    autoRefreshTimer = null;
  }
}

document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible'){
    startAutoRefresh();
    tick();
  }else{
    stopAutoRefresh();
  }
});

if(document.visibilityState === 'visible') startAutoRefresh();

init();
</script>
